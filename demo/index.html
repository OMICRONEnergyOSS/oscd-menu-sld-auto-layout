<title>oscd-menu-sld-auto-layout demo</title>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Roboto:wght@300;400;500&display=swap"
/>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Material+Symbols+Outlined&display=block"
/>
<oscd-shell></oscd-shell>

<script type="module">
  import '@webcomponents/scoped-custom-element-registry';
  import '@omicronenergy/oscd-shell/oscd-shell.js';
  import OscdEditorSource from '@omicronenergy/oscd-editor-source';
  import OscdEditorSld from '@omicronenergy/oscd-editor-sld';
  import OscdMenuSldAutoLayout from '../dist/oscd-menu-sld-auto-layout.js';
  import {
  OscdMenuFileClose,
  OscdMenuOpen,
  OscdMenuSave,
  OscdMenuNew,
} from '@omicronenergy/oscd-menu-commons';
  import { plugins } from './plugins.js';

  const oscdShell = document.querySelector('oscd-shell');
  oscdShell.registry.define('oscd-menu-open', OscdMenuOpen);
  oscdShell.registry.define('oscd-menu-save', OscdMenuSave);
  oscdShell.registry.define('oscd-menu-new', OscdMenuNew);
  oscdShell.registry.define('oscd-menu-file-close', OscdMenuFileClose);
  oscdShell.registry.define('oscd-editor-source', OscdEditorSource);
  oscdShell.registry.define('oscd-editor-sld', OscdEditorSld);
  oscdShell.registry.define('oscd-menu-sld-auto-layout', OscdMenuSldAutoLayout);
  oscdShell.plugins = plugins;

const params = new URL(document.location).searchParams;
for (const [name, value] of params) {
  oscdShell.setAttribute(name, value);
}

/* By default, don't load a file. If a file name is passed as a paramter,
 * try load it. Super handy during development not having to repeatidly
 * re-open a file */
const docFile = params.get('doc');
if (docFile) {
  const sample = await fetch(docFile).then(r => r.text());
  oscdShell.docs = {
    [docFile]: new DOMParser().parseFromString(
      sample,
      'application/xml',
    ),
  };
  oscdShell.docName = docFile;
}
</script>

<style>
  * {
    margin: 0;
    padding: 0;
  }

  abbr {
    text-decoration: none;
    border-bottom: none;
  }
</style>
